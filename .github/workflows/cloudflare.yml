name: Build CyberMot for Cloudflare

on:
  push:
    branches: [main, master]
    paths: ["XHBlogs/**", ".github/workflows/cloudflare.yml"]
  pull_request:
    paths: ["XHBlogs/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the cybermot-blog Cloudflare Worker"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XHBlogs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: XHBlogs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cloudflare
      - run: npm run check:cloudflare
      - name: Deploy when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
